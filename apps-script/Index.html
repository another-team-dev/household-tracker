function toast(message,action){clearTimeout(S.toastTimer);$('#toasts').innerHTML=`<div class="toast"><span>${esc(message)}</span>${action?tr("<button data-action=\"toast-undo\">되돌리기</button>", "<button data-action=\"toast-undo\">Undo</button>"):tr("<button data-action=\"toast-close\" aria-label=\"닫기\">", "<button data-action=\"toast-close\" aria-label=\"Close\">")+icon('close')+'</button>'}</div>`;S.toastAction=action;S.toastTimer=setTimeout(()=>{$('#toasts').innerHTML='';},action?14000:6500);}
function showError(e){const el=$('#sheet-error');if(el)el.textContent=e.message;else toast(e.message);}
function nav(tab){if(S.tab==='chat'&&$('#chat-text'))S.draft=$('#chat-text').value;S.tab=tab;S.selecting=false;S.selected.clear();render();window.scrollTo({top:0});$('#main').focus({preventScroll:true});}
function render(){
  if(!S.data)return;
  document.body.dataset.page=S.tab;
  $('.topbar').hidden=false;
  $('.bottom-nav').hidden=false;
  $$('.nav-item').forEach(el=>{const active=el.dataset.tab===S.tab;el.classList.toggle('active',active);if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});
  $('#main').className='content'+(S.tab==='chat'?' chat-page':'');
  $('#main').innerHTML=`<div class="page">${({home:homeView,chat:chatView,list:listView,profile:profileView}[S.tab])()}</div>`;
  $('#composer').innerHTML=S.tab==='chat'?composerView():'';
  if(S.tab==='chat'){const t=$('#chat-text');t.value=S.draft;}
  hydrateIcons();
}
function empty(title,body,button='add-item',label=tr("물품 추가", "Add item"),glyph='box'){return `<div class="empty"><div class="empty-icon">${icon(glyph)}</div><h2>${esc(title)}</h2><p>${esc(body)}</p><button class="primary" data-action="${button}">${esc(label)}</button></div>`;}
function itemRow(i,select=false){
  const c=category(i.categoryId), checked=S.selected.has(i.id);
  return `<div class="row">${select?`<input type="checkbox" data-select="${esc(i.id)}" aria-label="${esc(i.name)} ${tr("선택", "Select")}" ${checked?'checked':''}>`:''}<button class="row-main" data-action="detail" data-id="${esc(i.id)}" style="display:flex;gap:13px;align-items:center;text-align:left;padding:0"><span class="glyph">${icon(c.icon)}</span><span class="row-main"><span class="row-title">${esc(i.name)}</span><span class="row-meta" style="display:block">${esc(c.name)}${i.location?' · '+esc(i.location):''} · ${esc(i.quantity)}${tr('', ' ')}${esc(unitLabel(i.quantity,i.unit))}</span>${i.dueDate?`<span class="progress ${esc(i.status)}"><span style="width:${i.progress}%"></span></span>`:''}</span><span class="row-end">${badge(i)}${i.estimated?tr("<span class=\"small muted\">추정</span>", "<span class=\"small muted\">Estimated</span>"):''}</span></button></div>`;
}
function homeView(){
  const items=S.data.items, due=items.filter(i=>i.quantity>0&&i.daysLeft!==null&&i.daysLeft<=i.reminderDays).sort(urgentSort), low=items.filter(i=>i.runningOut||i.quantity===0);
  const day=new Date(S.data.today+'T00:00:00+09:00').toLocaleDateString((language==='en'?'en-US':'ko-KR'),{month:'long',day:'numeric',weekday:'long',timeZone:'Asia/Seoul'});
  return `<div class="title-row"><div><p class="eyebrow">${esc(S.data.settings.householdName)} · ${esc(day)}</p><h1>${tr("오늘 확인할 물품", "Items to check today")}</h1></div></div>
    <button class="hero-due" data-action="due-list"><span><span class="small">${tr("기한과 교체일을 확인해 주세요", "Check upcoming expiry and replacement dates")}</span><strong>${due.length}<span style="font-size:21px;margin-left:5px">${tr("개", due.length===1?" item":" items")}</span></strong><span class="small">${due.length?tr("다가오는 일정을 한눈에", "See what’s due soon"):tr("오늘은 여유로워요", "Nothing due soon")}</span></span><span class="hero-icon">${icon('clock')}</span></button>
    <div class="quick"><button data-action="camera"><span class="quick-icon">${icon('camera')}</span>${tr("사진으로 추가", "Add by photo")}</button><button data-action="open-chat"><span class="quick-icon">${icon('chat')}</span>${tr("말로 기록", "Tell the assistant")}</button><button data-action="add-item"><span class="quick-icon">${icon('plus')}</span>${tr("직접 추가", "Add manually")}</button></div>
    ${!items.length?empty(tr("우리 집에 무엇이 있나요?", "What’s in your home?"),tr("물품 하나부터 기록해 보세요. 소비기한과 교체 시기를 함께 챙겨 드려요.", "Start by adding one item. Track when it expires or needs replacing."))+`<button class="text-btn full" data-action="seed">${tr("예시 물품 5개로 둘러보기", "Explore with five sample items")}</button>`:`<div class="section-title"><h2>${tr("다가오는 일정", "Upcoming dates")}</h2><button class="text-btn" data-action="notifications">${tr("알림 보기", "View reminders")}</button></div>${due.length?due.slice(0,5).map(i=>itemRow(i)).join(''):tr("<p class=\"notice\">지금 확인할 일정이 없어요.</p>", "<p class=\"notice\">Nothing to check right now.</p>")}<div class="divider"></div><div class="section-title"><h2>${tr("장보기 전에", "Before you shop")}</h2><button class="text-btn" data-action="shopping-list">${low.length}${tr("개 보기", low.length===1?" item":" items")}</button></div><button class="row" data-action="shopping-list"><span class="glyph">${icon('bag')}</span><span class="row-main"><span class="row-title">${tr("부족한 물품", "Running low")}</span><span class="row-meta" style="display:block">${low.length?esc(low.slice(0,3).map(i=>i.name).join(', ')):tr("부족한 물품을 표시해 두세요", "Mark items that are running low")}</span></span>${icon('chevron')}</button><button class="row" data-action="shopping-manage"><span class="glyph">${icon('bag')}</span><span class="row-main"><span class="row-title">${tr("장보기 목록 관리", "Manage shopping list")}</span><span class="row-meta" style="display:block">${(S.data.shopping||[]).filter(x=>!x.checked).length}${tr("개 구매 예정", " to buy")}</span></span>${icon('chevron')}</button><button class="row" data-action="analytics"><span class="glyph">${icon('clock')}</span><span class="row-main"><span class="row-title">${tr("소비·낭비 분석", "Usage & waste analytics")}</span><span class="row-meta" style="display:block">${tr("우리 집 재고 사용 현황 보기", "Review household inventory activity")}</span></span>${icon('chevron')}</button><button class="row" data-action="all-items"><span class="glyph">${icon('box')}</span><span class="row-main"><span class="row-title">${tr("전체 물품", "All items")}</span><span class="row-meta" style="display:block">${items.length}${tr("개 항목", items.length===1?" item":" items")} · ${S.data.categories.length}${tr("개 카테고리", S.data.categories.length===1?" category":" categories")}</span></span>${icon('chevron')}</button>`}`;
}
function urgentSort(a,b){return (a.quantity===0?100000:a.daysLeft===null?99999:a.daysLeft)-(b.quantity===0?100000:b.daysLeft===null?99999:b.daysLeft)||a.name.localeCompare(b.name,'ko');}
function filteredItems(){
  const q=S.query.trim().toLowerCase();
  return S.data.items.filter(i=>(!S.category||q||i.categoryId===S.category)&&(!q||[i.name,category(i.categoryId).name,i.location,i.notes].join(' ').toLowerCase().includes(q))&&(S.filter==='all'||S.filter==='soon'&&i.quantity>0&&i.daysLeft!==null&&i.daysLeft<=i.reminderDays||S.filter==='expired'&&i.quantity>0&&i.daysLeft!==null&&i.daysLeft<0||S.filter==='shopping'&&(i.runningOut||i.quantity===0)||S.filter==='nodate'&&!i.dueDate)).sort(S.sort==='name'?(a,b)=>a.name.localeCompare(b.name,'ko'):S.sort==='recent'?(a,b)=>b.createdAt.localeCompare(a.createdAt):urgentSort);
}
function listView(){
  const categories=S.listView==='categories'&&!S.query.trim();
  return `${S.category&&!S.query?`<button class="crumb" data-action="category-back">${icon('back')}${tr("카테고리", "Categories")}</button>`:''}<div class="title-row"><div><p class="eyebrow">${tr("우리 집 재고", "Home inventory")}</p><h1>${S.category&&!S.query?esc(category(S.category).name):tr("물품 목록", "Inventory")}</h1></div><button class="icon-btn" data-action="${categories?'add-category':'add-item'}" aria-label="${categories?tr("카테고리 추가", "Add category"):tr("물품 추가", "Add item")}">${icon('plus')}</button></div>
    <div class="search-wrap">${icon('search')}<input id="search" type="search" placeholder="${tr("집에 있는 물품 검색", "Search your inventory")}" aria-label="${tr("전체 카테고리에서 물품 검색", "Search all categories")}" value="${esc(S.query)}"></div>
    ${!S.category?`<div class="segmented"><button data-action="list-items" class="${!categories?'active':''}">${tr("물품", "Items")}</button><button data-action="list-categories" class="${categories?'active':''}">${tr("카테고리", "Categories")}</button></div>`:''}
    ${categories?categoriesView():`<div class="filters">${[['all',tr("전체", "All")],['soon',tr("기한 임박", "Due soon")],['expired',tr("기한 지남", "Past due")],['shopping',tr("장보기", "Shopping")],['nodate',tr("날짜 없음", "No date")]].map(([key,label])=>`<button class="chip ${S.filter===key?'active':''}" data-filter="${key}">${label}</button>`).join('')}</div><div class="toolbar"><span class="small muted">${filteredItems().length}${tr("개 항목", filteredItems().length===1?" item":" items")}${S.query?tr(" · 모든 카테고리", " · All categories"):''}</span><div class="toolbar-controls"><button class="selection-toggle" data-action="selection" aria-pressed="${S.selecting}">${S.selecting?tr("선택 취소", "Cancel selection"):tr("선택", "Select")}</button><select id="sort" aria-label="${tr("정렬", "Sort")}"><option value="urgent" ${S.sort==='urgent'?'selected':''}>${tr("급한 순", "Most urgent")}</option><option value="name" ${S.sort==='name'?'selected':''}>${tr("이름 순", "Name")}</option><option value="recent" ${S.sort==='recent'?'selected':''}>${tr("최근 추가 순", "Recently added")}</option></select></div></div>${S.selecting?selectionBar('items'):''}<div id="item-results">${itemResults()}</div>`}`;
}
function itemResults(){const items=filteredItems();return items.length?items.map(i=>itemRow(i,S.selecting)).join(''):empty(S.query?tr("집에서 찾지 못했어요", "No matching items at home"):tr("아직 물품이 없어요", "No items yet"),S.query?`“${S.query}”${tr("을 새 물품으로 등록할 수 있어요", " can be added as a new item")}.`:tr("물품을 추가하거나 챗봇에게 알려 주세요.", "Add an item manually or tell the assistant."))+(S.query?'':`<button class="secondary full" style="margin-top:10px" data-action="open-chat">${icon('chat')}${tr("챗봇에게 말하기", "Tell the assistant")}</button>`);}
function categoriesView(){return `<div class="toolbar"><span class="small muted">${S.data.categories.length}${tr("개 카테고리", S.data.categories.length===1?" category":" categories")}</span><button class="selection-toggle" data-action="selection" aria-pressed="${S.selecting}">${S.selecting?tr("선택 취소", "Cancel selection"):tr("선택", "Select")}</button></div>${S.selecting?selectionBar('categories'):''}<div class="categories">${S.data.categories.map(c=>{const items=S.data.items.filter(i=>i.categoryId===c.id),urgent=items.filter(i=>i.quantity>0&&i.daysLeft!==null&&i.daysLeft<=i.reminderDays).length;return `<div class="row" data-category-row="${esc(c.id)}">${S.selecting&&c.id!=='uncategorized'?`<input type="checkbox" data-select="${esc(c.id)}" aria-label="${esc(c.name)} ${tr("선택", "Select")}" ${S.selected.has(c.id)?'checked':''}>`:''}<button class="row-main" data-action="open-category" data-id="${esc(c.id)}" style="display:flex;align-items:center;gap:13px;text-align:left;padding:0"><span class="glyph" style="color:${esc(c.color)}">${icon(c.icon)}</span><span class="row-main"><span class="row-title">${esc(c.name)}</span><span class="row-meta" style="display:block">${items.length}${tr("개 물품", items.length===1?" item":" items")}${urgent?tr(" · 확인 필요 ", " · Needs attention: ")+urgent+tr("개", ""):''}</span></span></button>${!S.selecting&&c.id!=='uncategorized'?`<button class="icon-btn" data-action="edit-category" data-id="${esc(c.id)}" aria-label="${esc(c.name)} ${tr("편집", "Edit")}">${icon('edit')}</button>`:icon('chevron')}</div>`;}).join('')}</div><button class="secondary full" style="margin-top:22px" data-action="add-category">${icon('plus')}${tr("카테고리 추가", "Add category")}</button>`;}
function selectionBar(kind) {
  const count = S.selected.size;
  const available = kind==='items' ? filteredItems().length : S.data.categories.filter(c=>c.id!=='uncategorized').length;
  return `<div class="select-bar">
    <span class="small">${tr(`${count}개 선택`, `${count} selected`)}</span>
    <div class="select-actions">
      <button class="text-btn" data-action="select-all" data-kind="${kind}" ${!available||count===available?'disabled':''}>${tr('모두 선택','Select all')}</button>
      <button class="text-btn" data-action="select-none" ${count?'':'disabled'}>${tr('모두 해제','Deselect all')}</button>
      ${kind==='items'? `<button class="text-btn" data-action="select-expired">${tr('기한 지난 물품 선택','Select past-due items')}</button>`:''}
      <button class="text-btn" style="color:var(--red)" data-action="delete-selected" data-kind="${kind}" ${count?'':'disabled'}>${tr('삭제','Delete')}</button>
    </div>
  </div>`;
}
function chatView() {
  const messages = S.data.chat;
  const hasHistory = messages.length || S.outbox.length || S.draft || S.attachment;
  return `
    <div class="title-row">
      <div><p class="eyebrow">${tr('물품 기록 도우미','Inventory assistant')}</p><h1>${tr('집기록 챗','Household chat')}</h1></div>
      <span class="bot-symbol" style="margin:0">${icon('sparkle')}</span>
    </div>
    <div class="chat-controls">
      <div class="segmented" role="group" aria-label="${tr('입력 모드','Input mode')}">
        <button data-action="chat-mode" data-mode="demo" aria-pressed="${S.chatMode==='demo'}" class="${S.chatMode==='demo'?'active':''}">${tr('시연','Demo')}</button>
        <button data-action="chat-mode" data-mode="live" aria-pressed="${S.chatMode==='live'}" class="${S.chatMode==='live'?'active':''}">${tr('실제 입력','Live input')}</button>
      </div>
      <button class="text-btn" data-action="clear-chat" ${hasHistory&&!S.chatBusy?'':'disabled'}>${tr('채팅 내역 삭제','Clear chat')}</button>
    </div>
    ${S.chatMode==='demo'?`<p class="notice blue">${tr('사진이나 마이크를 눌러 시연을 시작하세요. 날짜는 오늘을 기준으로 자동 계산되며 결과는 내 물품 목록에 저장돼요.','Tap the photo or microphone to start a demo. Dates are calculated from today, and the results are saved to your inventory.')}</p>`:''}
    ${S.chatMode==='live'&&!S.data.aiConfigured?`<p class="notice">${tr('Gemini API 키를 설정하면 실제 채팅과 사진 입력을 사용할 수 있어요.','Configure a Gemini API key to use live chat and photo input.')}</p>`:''}
    ${!messages.length&&!S.demoPreview&&!S.chatBusy?`<div class="chat-intro"><p>${tr('사진이나 마이크로 물품을 추가해 보세요.','Try adding items by photo or microphone.')}</p>
        ${S.chatMode==='live'?`<div class="suggestions">
          <button class="chip" data-suggest="${tr('이번 주에 기한이 다가오는 물품 알려줘','Which items are due this week?')}">${tr('이번 주에 확인할 물품','Due this week')}</button>
          <button class="chip" data-suggest="${tr('집에 우유가 있어?','Do we have milk?')}">${tr('우유가 남아 있나요?','Any milk left?')}</button>
          <button class="chip" data-suggest="${tr('우유 2팩을 냉장고에 추가해 줘','Add two cartons of milk to the fridge.')}">${tr('물품 추가해 보기','Try adding an item')}</button>
        </div>`:''}</div>`:''}
    <div class="chat-messages">
      ${messages.map(messageView).join('')}
      ${S.outbox.map(m=>`<div class="message user"><div class="bubble">${esc(m.text)}</div><div class="pending-note">${tr('연결 후 보낼 메시지','Waiting to send')} <button class="text-btn" data-action="remove-queued" data-id="${esc(m.requestId)}">${tr('취소','Cancel')}</button></div></div>`).join('')}
      ${S.demoPreview?messageView(S.demoPreview):''}
      ${S.chatBusy?`<div class="message" role="status"><div class="bubble demo-loading"><span class="spinner" aria-hidden="true"></span><span>${esc(demoLoadingText())}</span></div></div>`:''}
    </div>`;
}
function itemPreviewMarkup(item) {
  const details = [];
  if (item.date) details.push(`${esc(dateLabels()[item.dateType] || tr('기한','Due date'))}: ${esc(fmt(item.date))}`);
  if (item.openedOn) details.push(`${tr('개봉일','Opened')}: ${esc(fmt(item.openedOn))}`);
  return `<button class="message-item-preview" data-action="detail" data-id="${esc(item.id)}">
    <span class="preview-glyph">${icon('box')}</span>
    <span class="preview-copy"><strong>${esc(item.name)}</strong><span>${details.join(' · ') || tr('상세 정보 보기','View item details')}</span></span>
    <span class="preview-link">${tr('보기','View')} ${icon('chevron')}</span>
  </button>`;
}
function messageView(m){
  const photo = m.demoPhoto ? `<img class="chat-demo-photo" src="data:image/jpeg;base64,${$('#demo-seoul-milk').textContent.trim()}" alt="${tr('서울우유 팩과 날짜가 찍힌 사진','Photo of a Seoul Milk carton showing its dates')}">` : '';
  const demoLabel = m.demo ? ' · ' + tr('시연','Demo') : '';
  const voiceTranscript = m.role==='user' && m.attachmentType==='demo/voice'
    ? `<div class="voice-transcript-tag">${icon('mic')}<span>${tr('음성 전사','VOICE TRANSCRIPT')}</span></div>` : '';
  const linkedItems = m.itemIds&&m.itemIds.length
    ? `<div class="message-item-previews">${m.itemIds.map(id=>S.data.items.find(i=>i.id===id)).filter(Boolean).map(itemPreviewMarkup).join('')}</div>` : '';
  return `<article class="message ${m.role==='user'?'user':''}">
    <div class="message-label">${m.role==='user'?tr("나", "You"):tr("집기록", "Household Tracker")}${m.attachmentType?' · '+(m.attachmentType.startsWith('image/')?tr("사진", "Photo"):tr("음성", "Voice")):''}${demoLabel}</div>
    ${photo}${voiceTranscript}<div class="bubble">${esc(m.text)}</div>
    ${m.status==='processing'&&!S.chatBusy?tr("<div class=\"pending-note\">처리 중이에요. 잠시 뒤 새로고침해 주세요.</div>", "<div class=\"pending-note\">Processing. Refresh in a moment.</div>"):''}
    ${linkedItems}
    ${m.pending?`<div class="message-actions"><button data-action="confirm-chat" data-id="${esc(m.id)}">${tr("삭제 대상 확인", "Review deletions")}</button><button data-action="cancel-chat" data-id="${esc(m.id)}">${tr("취소", "Cancel")}</button></div>`:''}
    ${m.action&&S.data.undo.bot&&m.action.id===S.data.undo.bot.id?`<div class="message-actions"><button data-action="undo-bot" data-id="${esc(m.action.id)}">${icon('undo')} ${tr("되돌리기", "Undo")}</button></div>`:''}
    ${m.demoWaiting&&!S.chatBusy?`<div class="message-actions"><button data-action="resume-photo-demo" data-id="${esc(m.id)}">${tr('사진 시연 계속','Continue photo demo')}</button></div>`:''}
    ${m.failed?`<div class="message-actions"><button data-action="retry-chat" data-id="${esc(m.replyTo)}">${tr("다시 보내기", "Resend")}</button><button data-action="add-item">${tr("직접 추가", "Add manually")}</button></div>`:''}
    ${m.resolved?`<p class="pending-note">${m.resolved==='confirmed'?tr("변경을 적용했어요", "Changes saved"):tr("취소한 요청이에요", "Request canceled")}</p>`:''}
  </article>`;
}
function composerView() {

    <div class="composer-tools">
      <button class="icon-btn" data-action="photo" aria-label="${S.chatMode==='demo'?tr('사진 시연','Photo demo'):tr('사진 첨부','Attach photo')}" ${disabled}>${icon('image')}</button>
      <button class="icon-btn" data-action="voice" aria-label="${S.chatMode==='demo'?tr('마이크 시연','Microphone demo'):tr('마이크','Microphone')}" ${disabled}>${icon('mic')}</button>
      <span>${S.chatMode==='demo'?tr('시연용 입력','Demo inputs'):S.attachment?tr('전송하면 사진이 Gemini로 전달돼요.','The photo is sent to Gemini when you send the message.'):tr('사진 또는 받아쓰기','Photo or dictation')}</span>

function notifyDueItems(){
  if(!('Notification' in window)||Notification.permission!=='granted'||!S.data)return;
  const due=S.data.items.filter(i=>i.quantity>0&&i.daysLeft!==null&&i.daysLeft<=i.reminderDays&&!i.snoozedUntil);
  const shown=preference('household-tracker-notified-'+S.workspaceId);
  const seen=new Set(shown?shown.split(','):[]), fresh=due.filter(i=>!seen.has(i.id+':'+i.dueDate));

  fresh.slice(0,3).forEach(i=>{try{new Notification(tr('기한 확인이 필요해요','Item needs attention'),{body:i.name+' · '+(i.daysLeft<0?tr('기한 지남','Past due'):i.daysLeft===0?tr('오늘까지','Due today'):i.daysLeft+countWord(i.daysLeft,'일 남음',' day left',' days left'))});}catch(e){}});

}

async function undoAction(source,actionId,force=false){try{const r=await mutation('undo',{source,actionId,force});closeSheet();toast(r.message);}catch(e){if(e.code==='UNDO_CONFLICT'&&!force){openSheet(tr("최근 수정 내용이 있어요", "Some entries have newer edits"),`<p>${esc(e.message)}</p><ul class="delete-list">${(e.details.names||[]).map(n=>`<li>${esc(n)}</li>`).join('')}</ul><div class="btn-row"><button class="secondary" data-action="close-modal">${tr("유지", "Keep edits")}</button><button class="danger" data-action="force-undo" data-source="${source}" data-id="${esc(actionId||'')}">${tr("덮어쓰고 되돌리기", "Overwrite and undo")}</button></div>`);}else showError(e);}}
function readOutbox(){try{const q=JSON.parse(localStorage.getItem('household-tracker-outbox:'+S.workspaceId)||'[]');S.outbox=Array.isArray(q)?q.filter(m=>typeof m.text==='string'&&typeof m.requestId==='string'&&(m.chatEpoch||0)===(S.data?.chatEpoch||0)).slice(0,20):[];}catch{S.outbox=[];}}
function persistOutbox(){try{localStorage.setItem('household-tracker-outbox:'+S.workspaceId,JSON.stringify(S.outbox));}catch{toast(tr("기기 저장공간을 사용할 수 없어 대기 메시지를 보관하지 못했어요.", "Pending messages couldn't be saved to this device."));}}
async function sendChat(text,attachment,retryId){
  if(S.chatBusy)return;
  text=text.trim();if(!text&&!attachment)return;
  const requestId=retryId||(S.retryChat?.text===text?S.retryChat.requestId:uid());
  if(!navigator.onLine){if(attachment){toast(tr("사진은 연결된 상태에서 보내 주세요.", "Connect to send photos."));return;}if(S.outbox.length>=20){toast(tr("대기 메시지는 최대 20개까지 보관할 수 있어요.", "Up to 20 messages can wait to send."));return;}S.outbox.push({requestId,text,chatEpoch:S.data?.chatEpoch||0});persistOutbox();S.draft='';render();toast(tr("연결되면 텍스트 메시지를 보낼게요.", "Messages will send after you reconnect."));return;}
  S.chatBusy=true;S.draft='';S.attachment=null;render();scrollChat();
  try{const r=await rpc('chat',{requestId,text,attachment:attachment?{mimeType:attachment.mimeType,data:attachment.data}:null});snapshot(r.state);S.retryChat=null;S.outbox=S.outbox.filter(m=>m.requestId!==requestId);persistOutbox();if(r.failed&&attachment)S.lastFailedAttachment={requestId,attachment};}
  catch(e){if(e.code==='CHAT_RESET'){await refresh();toast(e.message);}else if(e.code==='UNDO_CONFLICT'){await undoAction('bot',S.data.undo.bot?.id);}else{S.draft=text;S.attachment=attachment;if(e.code==='NETWORK')S.retryChat={text,requestId};toast(e.message);}}
  finally{S.chatBusy=false;render();scrollChat();}
}
function scrollChat(){if(S.tab==='chat')requestAnimationFrame(()=>window.scrollTo({top:document.documentElement.scrollHeight,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'}));}
async function flushOutbox(){if(S.flushing||!navigator.onLine||S.chatBusy)return;S.flushing=true;try{for(const m of [...S.outbox]){if(!navigator.onLine)break;if((m.chatEpoch||0)!==(S.data?.chatEpoch||0))continue;await sendChat(m.text,null,m.requestId);if(S.outbox.some(q=>q.requestId===m.requestId))break;}}finally{S.flushing=false;}}
async function fileAttachment(file) {
  if (!file) return null;
  if (!['image/jpeg','image/png','image/webp'].includes(file.type)) throw new Error(tr('JPG, PNG 또는 WebP 사진을 선택해 주세요.','Choose a JPG, PNG, or WebP image.'));
  if (file.size > 12 * 1024 * 1024) throw new Error(tr('12MB 이하의 사진을 선택해 주세요.','Choose an image up to 12 MB.'));
  const imageUrl = URL.createObjectURL(file);
  try {
    const image = new Image();
    image.src = imageUrl;
    try { await image.decode(); }
    catch { throw new Error(tr('사진을 읽지 못했어요. 다른 사진을 선택해 주세요.','Couldn’t read the image. Choose another photo.')); }
    const ratio = Math.min(1, 1600 / Math.max(image.width,image.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(image.width*ratio));
    canvas.height = Math.max(1, Math.round(image.height*ratio));
    const context = canvas.getContext('2d');
    context.fillStyle = '#fff';
    context.fillRect(0,0,canvas.width,canvas.height);
    context.drawImage(image,0,0,canvas.width,canvas.height);
    const data = canvas.toDataURL('image/jpeg',.83).split(',')[1];
    if (!data || data.length > 2800000) throw new Error(tr('2MB 이하로 전송할 수 있는 사진을 선택해 주세요.','Choose an image that can be sent within 2 MB.'));
    return {mimeType:'image/jpeg',data,name:file.name};
  } finally { URL.revokeObjectURL(imageUrl); }
}
function voiceInput() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    toast(tr('이 브라우저는 마이크 받아쓰기를 지원하지 않아요. 키보드 받아쓰기를 이용해 주세요.','This browser doesn’t support microphone dictation. Try keyboard dictation.'));
    return;
  }
  if (S.recognizing || S.chatBusy) return;
  const recognition = new SpeechRecognition();
  recognition.lang = language==='en' ? 'en-US' : 'ko-KR';
  recognition.onresult = event => {
    S.draft = (S.draft ? S.draft+' ' : '') + event.results[0][0].transcript;
    render();
  };
  recognition.onerror = () => toast(tr('마이크를 사용할 수 없어요. 키보드 받아쓰기를 이용해 주세요.','Microphone unavailable. Try keyboard dictation.'));
  recognition.onend = () => { S.recognizing=false; };
  try {
    recognition.start();
    S.recognizing=true;
    toast(tr('듣고 있어요. 물품을 말씀해 주세요.','Listening. Tell me about your item.'));
  } catch {
    toast(tr('마이크를 시작하지 못했어요. 키보드 받아쓰기를 이용해 주세요.','Couldn’t start the microphone. Try keyboard dictation.'));
  }
}

const demoDelay = milliseconds => new Promise(resolve=>setTimeout(resolve,milliseconds));
function showDemoStage(stage, preview=null) {
  S.demoLoading=stage;
  S.demoPreview=preview;
  render();
  scrollChat();
}
async function runChatDemo(kind, pendingId) {
  if (S.chatBusy || S.recognizing) return;
  if (!navigator.onLine) { toast(tr('물품을 저장하려면 연결 상태에서 시연해 주세요.','Connect to the internet to run a demo and save its items.')); return; }
  const chatEpoch=S.data.chatEpoch;
  S.chatBusy=true;
  try {
    if (kind==='voice') {
      showDemoStage('voice');
      await demoDelay(7000);
      const result=await rpc('chatDemo',{requestId:uid(),step:'voice',chatEpoch});
      snapshot(result.state);
    } else {
      let photoId=pendingId;
      if (!photoId) {
        showDemoStage('photo',{role:'user',demo:true,demoPhoto:true,attachmentType:'image/jpeg',text:tr('이 사진에 있는 우유를 추가해 줘.','Please add the milk in this photo.')});
        await demoDelay(1600);
        const started=await rpc('chatDemo',{requestId:uid(),step:'photoStart',chatEpoch});
        snapshot(started.state);
        photoId=started.photoId;
        showDemoStage('');
        await demoDelay(1800);
      }
      showDemoStage('save',{role:'user',demo:true,text:tr('아 이틀 전에 개봉했어','Oh, I opened it two days ago.')});
      await demoDelay(1100);
      const finished=await rpc('chatDemo',{requestId:uid(),step:'photoFinish',photoId,chatEpoch});
      snapshot(finished.state);
    }
  } catch (error) {
    if (error.code==='CHAT_RESET') await refresh().catch(()=>{});
    toast(error.message);
  } finally {
    S.chatBusy=false;
    showDemoStage('');
  }
}

document.addEventListener('click',async event=>{
  const tab=event.target.closest('[data-tab]');if(tab){nav(tab.dataset.tab);return;}
  const f=event.target.closest('[data-filter]');if(f){S.filter=f.dataset.filter;S.selected.clear();render();return;}

    else if(a==='analytics')analyticsView();

    else if(a==='add-category')categoryForm();
    else if(a==='edit-category')categoryForm(id);

    else if(a==='all-items'||a==='due-list'||a==='shopping-list'){S.category='';S.query='';S.listView='items';S.filter=a==='due-list'?'soon':a==='shopping-list'?'shopping':'all';nav('list');}
    else if(a==='list-items'||a==='list-categories'){S.listView=a==='list-items'?'items':'categories';S.query='';S.selecting=false;S.selected.clear();render();}
    else if(a==='open-category'){S.category=id;S.query='';S.filter='all';S.listView='items';S.selecting=false;S.selected.clear();render();}
    else if(a==='category-back'){S.category='';S.listView='categories';S.selecting=false;S.selected.clear();render();}
    else if(a==='selection'){S.selecting=!S.selecting;S.selected.clear();render();}
    else if(a==='select-all'){
      const records=button.dataset.kind==='categories'?S.data.categories.filter(c=>c.id!=='uncategorized'):filteredItems();
      S.selected=new Set(records.map(record=>record.id));render();
    }
    else if(a==='select-none'){S.selected.clear();render();}
    else if(a==='select-expired'){filteredItems().filter(i=>i.daysLeft!==null&&i.daysLeft<0&&i.quantity>0).forEach(i=>S.selected.add(i.id));render();}
    else if(a==='delete-selected')await deletePreview(button.dataset.kind,[...S.selected]);
    else if(a==='delete-one')await deletePreview('items',[id]);
    else if(a==='delete-category')await deletePreview('categories',[id]);
    else if(a==='commit-delete'){
      if(S.modal.saving)return;S.modal.saving=true;button.disabled=true;
      const m=S.modal,mode=$('[name=delete-mode]:checked')?.value||'move',targetId=$('#delete-target')?.value||'uncategorized';
      try{const r=await mutation(m.chatMessage?'chatConfirm':'deleteCommit',{kind:m.deletion.kind,ids:m.deletion.ids,revision:m.deletion.revision,confirmed:true,mode,targetId,...(m.chatMessage?{messageId:m.chatMessage.id}:{})});S.selecting=false;S.selected.clear();S.category=S.data.categories.some(c=>c.id===S.category)?S.category:'';S.modal.saving=false;closeSheet();render();toast(r.message,r.action);}finally{if(S.modal)S.modal.saving=false;button.disabled=false;}
    }
    else if(a==='quick'){const i=S.data.items.find(i=>i.id===id);const r=await mutation('quickAction',{id,expectedVersion:i.updatedAt,action:button.dataset.quick,days:1});itemDetail(id);toast(r.message,r.action);}
    else if(a==='seed'){const r=await mutation('seedExamples');toast(r.message,r.action);}
    else if(a==='support')supportView();
    else if(a==='open-ticket')supportView(id);
    else if(a==='help')helpView();
    else if(a==='open-notification'){
      const n=S.data.notifications.find(n=>n.id===id);if(!n)return;
      if(n.ticketId){await mutation('dismissNotification',{id});supportView(n.ticketId);}
      else if(S.data.items.some(i=>i.id===n.itemId))itemDetail(n.itemId);
      else{await mutation('dismissNotification',{id});notificationsView();toast(tr("이 물품은 이미 삭제되었어요.", "This item has already been deleted."));}
    }
    else if(a==='chat-mode'){if(!S.chatBusy&&!S.recognizing){S.chatMode=button.dataset.mode;render();}}
    else if(a==='clear-chat'){if(!S.chatBusy&&!S.recognizing)showClearChat();}
    else if(a==='confirm-clear-chat'){
      button.disabled=true;
      S.modal.saving=true;
      try {
        const result=await mutation('clearChat',{confirmed:true,chatEpoch:S.data.chatEpoch});

        S.chatMode='demo';S.modal.saving=false;closeSheet();render();

    }
    else if(a==='photo'){if(S.chatMode==='demo')await runChatDemo('photo');else $('#photo-input').click();}

    else if(a==='retry-chat'){
      const m=S.data.chat.find(m=>m.id===id);if(!m)return;
      let attachment=S.lastFailedAttachment?.requestId===id?S.lastFailedAttachment.attachment:null;
      if(m.attachmentType&&!attachment){toast(tr("원본 파일은 보관하지 않아요. 파일을 다시 첨부해 보내 주세요.", "Original attachments aren’t stored. Attach the file again before resending."));return;}
      await sendChat(m.text,attachment,id);
    }
    else if(a==='confirm-chat'){
      const m=S.data.chat.find(m=>m.id===id);if(!m?.pending)return;
      const categories=m.pending.actions.filter(a=>a.kind==='categoryDelete').map(a=>a.id),items=m.pending.actions.filter(a=>a.kind==='itemDelete').map(a=>a.id);
      const ids=categories.length?categories:items;const kind=categories.length?'categories':'items';
      const records=ids.map(id=>kind==='categories'?S.data.categories.find(c=>c.id===id):S.data.items.find(i=>i.id===id)).filter(Boolean);
      showDeleteSheet({kind,ids,records,items:categories.length?S.data.items.filter(i=>categories.includes(i.categoryId)):records,additionalItems:categories.length?S.data.items.filter(i=>items.includes(i.id)&&!categories.includes(i.categoryId)):[]},m);
    }
    else if(a==='cancel-chat'){await mutation('chatCancel',{messageId:id});toast(tr("요청을 취소했어요.", "Request canceled."));}
    else if(a==='remove-queued'){S.outbox=S.outbox.filter(m=>m.requestId!==id);persistOutbox();render();}
    else if(a==='inline-category'){
      if($('#inline-category'))return;
      const holder=document.createElement('div');holder.id='inline-category';holder.className='notice';holder.innerHTML=tr("<label class=\"field\">새 카테고리 이름<input id=\"inline-category-name\" maxlength=\"60\" placeholder=\"예: 구급함\"></label><button type=\"button\" class=\"text-btn\" data-action=\"save-inline-category\">카테고리 추가</button>", "<label class=\"field\">New category name<input id=\"inline-category-name\" maxlength=\"60\" placeholder=\"e.g. First aid\"></label><button type=\"button\" class=\"text-btn\" data-action=\"save-inline-category\">Add category</button>");
      button.after(holder);$('#inline-category-name').focus();
    }
    else if(a==='save-inline-category'){
      const r=await mutation('saveCategory',{category:{name:$('#inline-category-name').value,icon:'box',color:'#3182f6'}});
      const sel=$('[name=categoryId]',$('#item-form'));sel.innerHTML=S.data.categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');sel.value=r.categoryId;$('#inline-category').remove();
    }
    else if(a==='duplicate-separate')await finishItemSave({...S.duplicatePayload,allowDuplicate:true});
    else if(a==='duplicate-merge'){
      const old=S.duplicateItem;const payload={item:{...old,quantity:Number(old.quantity)+Number(S.duplicatePayload.item.quantity)},expectedVersion:old.updatedAt};await finishItemSave(payload);
    }
    else if(a==='retry-support'){
      const t=S.data.tickets.find(t=>t.messages.some(m=>m.id===id)),m=t.messages.find(m=>m.id===id);
      if(m.screenshot&&!S.supportAttachment){toast(tr("사진을 다시 첨부한 뒤 이메일 재전송을 눌러 주세요.", "Attach the image again, then select Resend email."));return;}
      await deliverSupport({ticketId:t.id,text:m.text,requestId:id,attachment:S.supportAttachment});
    }
  }catch(e){showError(e);}
});
document.addEventListener('input',event=>{
  if(event.target.id==='search'){
    S.query=event.target.value;S.selected.clear();
    const start=event.target.selectionStart;render();const field=$('#search');field.focus({preventScroll:true});try{field.setSelectionRange(start,start);}catch{}
  }
  if(event.target.id==='chat-text')S.draft=event.target.value;
});
document.addEventListener('change',event=>{
  if(event.target.id==='sort'){S.sort=event.target.value;render();}
  if(event.target.matches('[data-select]')){const id=event.target.dataset.select;if(event.target.checked)S.selected.add(id);else S.selected.delete(id);const kind=S.listView==='categories'&&!S.query?'categories':'items';const bar=$('.select-bar');if(bar)bar.outerHTML=selectionBar(kind);}
});
async function finishItemSave(payload){
  const r=await mutation('saveItem',payload);if(S.modal)S.modal.saving=false;closeSheet();toast(r.message,r.action);
}
async function deliverSupport(payload){
  const r=await rpc('supportSend',{...payload,requestId:payload.requestId||uid(),device:navigator.userAgent.slice(0,300),attachment:payload.attachment?{mimeType:payload.attachment.mimeType,data:payload.attachment.data}:null});
  snapshot(r.state);if(S.modal)S.modal.saving=false;S.supportAttachment=null;supportView(r.ticketId);toast(r.message);
}
document.addEventListener('submit',async event=>{
  const form=event.target;if(!['entry-form','item-form','category-form','settings-form','chat-form','support-form','shopping-form'].includes(form.id))return;event.preventDefault();
  if(form.id==='entry-form'){await enterWorkspace(form);return;}
  if(form.id==='chat-form'){await sendChat($('#chat-text').value,S.attachment);return;}
  await withForm(form,async()=>{
    const data=formObject(form);
    if(form.id==='item-form'){
      const old=S.modal.item;const item={...data,id:old.id,snoozedUntil:old.snoozedUntil||''};const payload={item,expectedVersion:old.updatedAt};
      try{await finishItemSave(payload);}catch(e){
        if(e.code==='DUPLICATE_ITEM'){
          S.duplicatePayload=payload;S.duplicateItem=e.details.item;
          $('#sheet-error').innerHTML=`${esc(e.message)}<p class="small muted" style="margin:8px 0">${tr("수량을 합치면 기존 날짜와 보관 정보를 유지해요", "Merging keeps the existing date and storage details")}. ${tr("다른 날짜의 물품은 별도로 저장하세요", "Save items with different dates separately")}.</p><div class="btn-row"><button type="button" class="secondary" data-action="duplicate-merge">${tr("수량 합치기", "Combine quantities")}</button><button type="button" class="secondary" data-action="duplicate-separate">${tr("별도 저장", "Save separately")}</button></div>`;
        }else throw e;
      }
    }else if(form.id==='category-form'){
      const c=S.modal.category;const r=await mutation('saveCategory',{category:{...data,id:c.id},expectedVersion:c.updatedAt});S.modal.saving=false;closeSheet();toast(r.message,r.action);
    }else if(form.id==='settings-form'){
      const r=await mutation('settings',{settings:data});toast(r.message);
    }else if(form.id==='shopping-form'){
      await mutation('shoppingAdd',{name:data.name,quantity:Number(data.quantity),unit:data.unit});shoppingManageView();
    }else if(form.id==='support-form'){
      if(!navigator.onLine)throw new Error(tr("문의는 연결된 상태에서 전송해 주세요. 작성한 내용은 이 화면에 남아 있어요.", "Connect before sending a support request. Your draft is still in this form."));
      await deliverSupport({ticketId:S.ticketId||null,text:data.text,attachment:S.supportAttachment});
    }
  });
});
['photo-input','camera-input','support-image'].forEach(id=>$('#'+id).addEventListener('change',async event=>{
  const file=event.target.files[0];event.target.value='';if(!file)return;
  try{const attachment=await fileAttachment(file);if(id==='support-image'){S.supportAttachment=attachment;$('#support-attachment').innerHTML=`${esc(attachment.name)} <button class="text-btn" type="button" id="remove-support-image">${tr("삭제", "Delete")}</button>`;$('#remove-support-image').onclick=()=>{S.supportAttachment=null;$('#support-attachment').textContent='';};}
    else{S.draft=$('#chat-text')?.value||S.draft;S.attachment=attachment;render();}}
  catch(e){showError(e);}
}));
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&S.modal){event.preventDefault();closeSheet();}
  if(event.key==='Tab'&&S.modal){
    const nodes=$$('button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled),textarea:not(:disabled)', $('.sheet')).filter(el=>el.offsetParent!==null);
    if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  }
  if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing&&event.keyCode!==229&&event.target.id==='chat-text'){event.preventDefault();$('#chat-form').requestSubmit();}
});
let pressTimer=null;
document.addEventListener('pointerdown',event=>{const row=event.target.closest('[data-category-row]');if(!row||S.selecting||row.dataset.categoryRow==='uncategorized')return;pressTimer=setTimeout(()=>{S.selecting=true;S.selected.add(row.dataset.categoryRow);S.longPressed=true;render();},600);});
['pointerup','pointercancel','pointermove'].forEach(type=>document.addEventListener(type,()=>clearTimeout(pressTimer)));
document.addEventListener('click',event=>{if(S.longPressed){S.longPressed=false;event.stopImmediatePropagation();event.preventDefault();}},true);
window.addEventListener('offline',()=>{$('#offline').hidden=false;});
window.addEventListener('online',()=>{$('#offline').hidden=true;flushOutbox();});
async function refresh(){snapshot(await rpc('bootstrap'));render();}
function preference(key, value) {
  try {
    if (value === undefined) return localStorage.getItem(key) || '';
    if (value === '') localStorage.removeItem(key);
    else localStorage.setItem(key, value);
  } catch {}
  return '';
}
let language = preference('household-tracker-language') === 'en' ? 'en' : 'ko';
function tr(ko, en) { return language === 'en' ? en : ko; }
function shellLanguage() {
  document.documentElement.lang=language;
  document.title=tr('집기록', 'Household Tracker');
  const labels=language==='en'?['Home','Chat','List','Profile']:[tr("홈", "Home"),tr("채팅", "Chat"),tr("목록", "List"),tr("프로필", "Profile")];
  $$('.nav-item').forEach((button,index)=>{button.lastChild.textContent=labels[index];});
  $$('.brand').forEach(brand=>{brand.lastChild.textContent=tr('집기록','Household Tracker');});
  $('.bottom-nav').setAttribute('aria-label',tr('주요 메뉴','Main navigation'));
  $('[data-action=refresh]').setAttribute('aria-label',tr('새로고침','Refresh'));
  $('[data-action=refresh]').title=tr('새로고침','Refresh');
  $('[data-action=notifications]').setAttribute('aria-label',tr('알림','Reminders'));
  $('#offline').textContent=tr('인터넷 연결이 끊겼어요. 텍스트 메시지는 연결 후 보낼 수 있어요.','You’re offline. Text messages will send after you reconnect.');
}
function showEntry(clear=false) {
  if(clear) preference('household-tracker-id','');
  S.workspaceId='';S.data=null;S.chatMode='demo';S.tab='home';S.listView='items';S.category='';S.query='';S.filter='all';S.sort='urgent';
  S.selecting=false;S.selected.clear();S.draft='';S.outbox=[];S.retryChat=null;S.lastFailedAttachment=null;S.attachment=null;S.supportAttachment=null;S.pendingMutations.clear();S.ticketId='';S.modalFocus=null;
  closeSheet();
  $('#composer').innerHTML='';$('#toasts').innerHTML='';
  $('.topbar').hidden=true;$('.bottom-nav').hidden=true;
  $('#main').className='content entry-content';
  $('#main').innerHTML=`<div class="entry-panel"><button class="text-btn language-choice" data-action="toggle-language">${tr('English','한국어')}</button><span class="brand-mark">${icon('home')}</span><h1>${tr('집기록','Household Tracker')}</h1><p class="muted">${tr('ID를 입력하면 내 물품 목록이 열려요. 처음 쓰는 ID는 새 목록으로 시작해요.','Enter your ID to open your inventory. A new ID starts an empty inventory.')}</p><form id="entry-form" class="form"><label class="field"><strong>ID</strong><input name="workspaceId" required minlength="4" maxlength="32" pattern="[A-Za-z0-9_\\-]{4,32}" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" placeholder="${tr('4~32자 영문, 숫자, _ 또는 -','4–32 letters, digits, _ or -')}"></label><button class="primary" type="submit">${tr('시작하기','Continue')}</button><p class="small muted">${tr('ID만 알면 목록을 열 수 있어요. 내 ID를 공유하지 마세요.','Anyone who knows your ID can open your inventory. Keep it private.')}</p><p id="entry-error" class="sheet-errors" role="alert"></p></form></div>`;
}
async function toggleLanguage() {
  if(S.busy||S.chatBusy||S.recognizing)return;
  const draft=$('#entry-form input')?.value;
  language=language==='en'?'ko':'en';
  preference('household-tracker-language',language);
  shellLanguage();
  if(S.data){closeSheet();try{await refresh();}catch(e){render();toast(e.message);}return;}
  showEntry();
  if(draft)$('#entry-form input').value=draft;
}
async function enterWorkspace(form) {
  const input=form.elements.workspaceId;
  const button=form.querySelector('button[type=submit]');
  input.value=input.value.trim().toLowerCase();
  if(!form.reportValidity())return;
  button.disabled=true;
  S.workspaceId=input.value;
  try{
    snapshot(await rpc('enter'));
    preference('household-tracker-id',S.workspaceId);
    readOutbox();render();flushOutbox();
  }catch(e){S.workspaceId='';$('#entry-error').textContent=e.message;}
  finally{button.disabled=false;}
}
async function start() {
  hydrateIcons();shellLanguage();$('#offline').hidden=navigator.onLine;
  showEntry();
  const remembered=preference('household-tracker-id');
  if(remembered){
    const form=$('#entry-form');
    form.elements.workspaceId.value=remembered;
    await enterWorkspace(form);
  }
}
start();
// Refresh reminders/replies while visible; never replace a form that is being edited.
setInterval(async()=>{if(document.visibilityState==='visible'&&S.data&&!S.busy&&S.modal?.title===tr("개발자 문의", "Developer support")&&S.ticketId){try{const r=await rpc('bootstrap');const previous=S.data.tickets.find(t=>t.id===S.ticketId)?.messages.length;snapshot(r);const t=r.tickets.find(t=>t.id===S.ticketId);if(t&&t.messages.length!==previous){const region=$('#support-messages');region.innerHTML=t.messages.map(m=>`<div class="support-message ${esc(m.role)}"><div class="small muted">${m.role==='user'?tr("나", "You"):tr("개발자", "Developer")} · ${esc(m.at.slice(0,10))}</div>${esc(m.text)}</div>`).join('');}}catch{}}if(document.visibilityState==='visible'&&S.data&&!S.busy&&!S.chatBusy&&!S.modal&&S.tab!=='profile')refresh().catch(()=>{});},60000);
</script>
</body>
</html>
